# Produção (Oracle / VM): front Next — espelha procedy-platform/web/docker-compose.prod.yml
# - Container worqera-web (sem ports no host)
# - Rede sharednet (nginx → worqera-web:80)
# - NEXT_PUBLIC_* no build (via .env.prod)
#
# 1. cp .env.prod.example .env.prod && chmod 600 .env.prod
# 2. Editar NEXT_PUBLIC_API_URL, PLATFORM_ADMIN, WORQERA_DOCKER_NETWORK
# 3. make prod-up
# 4. Nginx: upstream → server worqera-web:80;

name: worqera-web-prod

services:
  worqera-web:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-https://api.seudominio.com}
        NEXT_PUBLIC_APP_NAME: ${NEXT_PUBLIC_APP_NAME:-Worqera}
        NEXT_PUBLIC_MAX_PHOTOS: ${NEXT_PUBLIC_MAX_PHOTOS:-8}
        NEXT_PUBLIC_PLATFORM_ADMIN_EMAILS: ${NEXT_PUBLIC_PLATFORM_ADMIN_EMAILS:-}
    image: worqera-web:prod
    container_name: worqera-web
    env_file:
      - .env.prod
    environment:
      NODE_ENV: production
      PORT: "80"
      HOSTNAME: 0.0.0.0
    expose:
      - "80"
    networks:
      - proxy
    restart: unless-stopped
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:80').then((r)=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s

networks:
  proxy:
    name: ${WORQERA_DOCKER_NETWORK:-sharednet}
    external: ${WORQERA_DOCKER_NETWORK_EXTERNAL:-true}
