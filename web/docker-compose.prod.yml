# Produção (Oracle / VM): front Next — espelha Procedy.
# - Container worqera-web (sem ports no host)
# - Rede sharednet por padrão (nginx → worqera-web:80)
# - .env.prod é OPCIONAL (defaults abaixo). Só crie se precisar mudar URL/rede.
#
#   make prod-up
#   # ou: NEXT_PUBLIC_API_URL=https://api.seudominio.com make prod-up
#
# Nginx: upstream → server worqera-web:80;

name: worqera-web-prod

services:
  worqera-web:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-https://api.worqera.com}
        NEXT_PUBLIC_APP_NAME: ${NEXT_PUBLIC_APP_NAME:-Worqera}
        NEXT_PUBLIC_MAX_PHOTOS: ${NEXT_PUBLIC_MAX_PHOTOS:-10}
        NEXT_PUBLIC_PLATFORM_ADMIN_EMAILS: ${NEXT_PUBLIC_PLATFORM_ADMIN_EMAILS:-}
    image: worqera-web:prod
    container_name: worqera-web
    environment:
      NODE_ENV: production
      PORT: "80"
      HOSTNAME: 0.0.0.0
    expose:
      - "80"
    networks:
      - proxy
    restart: unless-stopped
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:80').then((r)=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s

networks:
  proxy:
    name: ${WORQERA_DOCKER_NETWORK:-sharednet}
    external: ${WORQERA_DOCKER_NETWORK_EXTERNAL:-true}
