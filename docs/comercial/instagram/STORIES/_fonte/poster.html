<!doctype html>
<html><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@500;600;700;800;900&family=IBM+Plex+Sans:wght@600;700&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:1080px;height:1920px;overflow:hidden;background:#0f0b1e;font-family:Inter,sans-serif}
.sc{position:absolute;inset:0;display:none;overflow:hidden}
.light{background:#F3F4F8;color:#110f17}
.white{background:#fff;color:#110f17}
.navy{background:#0f0b1e;color:#fff}
.purple{background:#6d28d9;color:#fff}
.eb{font-family:'IBM Plex Sans';font-weight:700;font-size:26px;letter-spacing:.3em;text-transform:uppercase}
.light .eb,.white .eb{color:#7C3AED}.navy .eb{color:#C99BFF}.purple .eb{color:#EBDCFF}
.h{font-weight:800;font-size:92px;line-height:1.02;letter-spacing:-.035em}
.sub{font-size:36px;font-weight:500;line-height:1.3;opacity:.75}
.top{position:absolute;left:84px;right:84px;top:250px}
.win{position:absolute;border-radius:28px;overflow:hidden;background:#fff;box-shadow:0 2px 0 rgba(0,0,0,.04),0 30px 60px -30px rgba(17,15,23,.35);border:1px solid #e3e3ea}
.bar{height:56px;background:#f6f6f9;border-bottom:1px solid #e6e6ee;display:flex;align-items:center;gap:12px;padding:0 22px}
.bar i{width:16px;height:16px;border-radius:50%;background:#dcdce4;display:block}
.bar span{margin-left:18px;font-size:20px;color:#8b8b98;background:#fff;border:1px solid #e6e6ee;border-radius:10px;padding:6px 16px}
.view{position:relative;overflow:hidden}
.view img{position:absolute;left:0;top:0;display:block}
.phone{position:absolute;width:520px;height:1100px;border-radius:72px;background:#0b0b10;padding:16px;box-shadow:0 40px 80px -30px rgba(0,0,0,.55)}
.phone .scr{width:100%;height:100%;border-radius:58px;overflow:hidden;position:relative;background:#fff}
.phone .scr img{width:100%;display:block;position:absolute;left:0;top:0}
.chip{position:absolute;display:inline-flex;align-items:center;gap:14px;padding:20px 30px;border-radius:999px;font-weight:700;font-size:34px;white-space:nowrap}
.dot{width:16px;height:16px;border-radius:50%}
.notif{position:absolute;width:880px;left:100px;background:#fff;border-radius:34px;padding:28px 32px;display:flex;gap:24px;box-shadow:0 30px 60px -20px rgba(0,0,0,.35);border:1px solid #ececf2}
.notif .ic{width:84px;height:84px;border-radius:22px;background:#25D366;flex:none;display:flex;align-items:center;justify-content:center}
.notif b{font-size:30px;color:#110f17}.notif p{font-size:30px;color:#3b3946;line-height:1.3;margin-top:6px}
.notif small{font-size:24px;color:#8b8b98;float:right;font-weight:500}
.big{font-weight:900;letter-spacing:-.05em;line-height:.9}
.strike{position:absolute;left:-10px;right:-10px;top:55%;height:14px;background:#a78bfa;transform-origin:left center;border-radius:8px}
.logo{width:150px;height:150px;border-radius:36px}
.btn{display:inline-flex;align-items:center;gap:18px;background:#7C3AED;color:#fff;font-weight:800;font-size:46px;padding:34px 58px;border-radius:999px}
.prog{position:absolute;left:84px;right:84px;top:150px;height:6px;display:flex;gap:10px}
.prog i{flex:1;background:rgba(127,127,140,.28);border-radius:4px;overflow:hidden;display:block}
.prog i b{display:block;height:100%;background:currentColor;width:0}
.mark{position:absolute;bottom:120px;left:0;right:0;text-align:center;font-size:26px;font-weight:600;opacity:.45;letter-spacing:.02em}
</style></head><body>
<section class="sc navy" style="display:block">
  <div class="top" style="top:200px">
    <div style="display:flex;align-items:center;gap:22px"><img src="worqera-logo.png" style="width:84px;height:84px;border-radius:22px"><span style="font-size:44px;font-weight:800;letter-spacing:-.02em">Worqera</span></div>
    <div class="h" style="font-size:104px;margin-top:56px">Do balcão<br>à entrega,<br><span style="color:#C99BFF">no controle.</span></div>
  </div>
  <div class="win" style="left:60px;width:1100px;top:880px;height:560px;border-color:#2a2440">
    <div class="bar"><i></i><i></i><i></i><span>app.worqera.com/kanban</span></div>
    <div class="view" style="height:504px"><img src="c-kanban.png" style="height:820px;top:-20px;left:-10px"></div>
  </div>
  <div class="phone" style="left:660px;top:800px;width:360px;height:660px;border-radius:56px;padding:12px"><div class="scr" style="border-radius:46px"><img src="shots/m-track.png"></div></div>
  <div class="notif" style="top:1250px;left:300px;width:740px;padding:22px 26px;border-radius:28px">
    <div class="ic" style="width:68px;height:68px;border-radius:18px"><svg width="40" height="40" viewBox="0 0 24 24" fill="#fff"><path d="M12 2a10 10 0 0 0-8.6 15.1L2 22l5-1.3A10 10 0 1 0 12 2Zm5.4 14.1c-.2.6-1.3 1.2-1.8 1.2-.5.1-1 .2-3.3-.7-2.8-1.1-4.6-4-4.7-4.2-.1-.2-1.1-1.5-1.1-2.8 0-1.3.7-2 1-2.3.2-.3.5-.3.7-.3h.5c.2 0 .4 0 .6.5l.8 2c.1.2.1.4 0 .5l-.4.6-.3.4c-.1.1-.3.3-.1.6.2.3.8 1.3 1.7 2.1 1.2 1 2.1 1.4 2.4 1.5.3.1.5.1.6-.1l.9-1c.2-.3.4-.2.6-.1l1.9.9c.3.1.5.2.5.3.1.2.1.8-.1 1.4Z"/></svg></div>
    <div style="flex:1"><b style="font-size:26px">Ateliê Sola</b><small style="font-size:22px">agora</small><p style="font-size:26px">Seu pedido #0001 ficou pronto ✅</p></div>
  </div>
  <div class="chip" style="left:84px;top:770px;background:#7C3AED;color:#fff;font-size:36px">R$ 1 milhão+ em pedidos</div>
  <div style="position:absolute;left:84px;right:84px;top:1520px;display:flex;flex-wrap:wrap;gap:14px">
  </div>
  <div style="position:absolute;left:84px;right:84px;top:1510px">
    <p style="font-size:38px;font-weight:600;color:#d8d4e6">Kanban por setor · QR · cliente avisado · orçamentos · financeiro</p>
    <div style="margin-top:34px;display:flex;align-items:center;justify-content:space-between">
      <span class="btn" style="font-size:40px;padding:28px 46px">Teste 7 dias grátis</span>
      <span style="font-size:34px;font-weight:700;color:#C99BFF">link na bio ↗</span>
    </div>
  </div>
</section>
</body></html>
