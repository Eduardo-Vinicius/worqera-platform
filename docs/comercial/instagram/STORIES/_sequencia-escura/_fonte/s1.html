<!doctype html><html><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@500;600;700&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:1080px;height:1920px;overflow:hidden;background:#0b0b0d;color:#fff}
.t{position:absolute;left:90px;right:90px;text-align:center;font-family:Georgia,'Times New Roman',serif;font-size:50px;line-height:1.38;text-shadow:0 1px 2px rgba(0,0,0,.5)}
.t.s{font-size:44px}
.img{position:absolute;left:50%;transform:translateX(-50%);border-radius:22px;overflow:hidden;box-shadow:0 30px 70px -20px rgba(0,0,0,.8);border:1px solid rgba(255,255,255,.08)}
.img img{display:block;width:100%}
.ph{position:absolute;width:400px;height:840px;border-radius:56px;background:#000;padding:12px;border:2px solid #2a2a30}
.ph div{width:100%;height:100%;border-radius:44px;overflow:hidden}
.ph img{width:100%;display:block}
.pill{display:inline-flex;align-items:center;gap:16px;background:#fff;color:#111;border-radius:999px;padding:14px 30px 14px 14px;font-family:Inter;font-weight:700;font-size:38px}
.pill img{width:60px;height:60px;border-radius:16px}
.logos{position:absolute;left:0;right:0;display:flex;justify-content:center;gap:70px}
.logos div{text-align:center;font-family:Inter;font-weight:600;font-size:30px;color:#d4d4dc}
.logos img{width:260px;height:260px;display:block;margin:0 auto 22px}
.num{position:absolute;left:90px;right:90px;display:flex;justify-content:center;gap:60px;font-family:Inter;text-align:center}
.num b{display:block;font-size:84px;font-weight:700;letter-spacing:-.04em}
.num span{font-size:28px;color:#a9a9b6;font-weight:500}
</style></head><body><div class="t" style="top:300px">Muita gente perguntou… então bora 😄</div>
<div class="img" style="top:420px;width:800px"><img src="desk.png" style="filter:brightness(1.08) contrast(1.05)"></div>
<div class="t" style="top:1400px">O nome é</div>
<div style="position:absolute;top:1490px;left:0;right:0;text-align:center"><span class="pill"><img src="worqera-logo.png">Worqera</span></div></body></html>
